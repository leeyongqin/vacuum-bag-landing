    font-weight: 700;

    background: white;
    color: var(--text);

  .f-input.error { border-color: var(--error); }

    font-weight: 600;

    border: 1.5px solid var(--border);
    border-radius: var(--radius);

    text-align: left;

  .review-note { font-size: 12.5px; color: var(--text-muted); line-height: 1.55; margin-bottom: 12px; }

// ─── Detect language from browser ────────────────────────────────
function detectLang() {
  const nav = navigator.language || navigator.languages?.[0] || 'de';
  const code = nav.split('-')[0].toLowerCase();
  return L[code] ? code : 'de';
}

let cur = detectLang();

// ─── Apply language ───────────────────────────────────────────────
function applyLang(k) {
  cur = k;
  const l = L[k];
  document.documentElement.lang = k;

  const set = (id, text) => { document.getElementById(id).textContent = text; };

  // Hero
  set('brandName', CONFIG.brandName);
  set('brandSub', l.brandSub);
  document.getElementById('heroTitle').innerHTML = l.title;
  set('heroSub', l.sub);

  // Value
  set('valueLabel', l.valueLabel);
  set('v1', l.v1);
  set('v2', l.v2);
  set('v3', l.v3);

  // Steps
  set('stepsLabel', l.stepsLabel);
  set('s1t', l.s1t); set('s1d', l.s1d);
  set('s2t', l.s2t); set('s2d', l.s2d);
  set('s3t', l.s3t); set('s3d', l.s3d);

  // Form
  set('emailLabel', l.emailLabel);
  document.getElementById('emailInput').placeholder = l.emailPh;
  set('orderLabel', l.orderLabel);
  document.getElementById('orderInput').placeholder = l.orderPh;
  set('optinText', l.optin);
  set('ctaText', l.cta);
  set('gdprText', l.gdpr);
  set('emailErr', l.emailErr);
  set('orderErr', l.orderErr);
  set('submitErr', l.submitErr);

  // Success
  set('okTitle', l.okTitle);
  set('okSub', l.okSub);
  document.getElementById('promoBox').style.display = CONFIG.promoCode ? '' : 'none';
  set('promoLabel', l.promoLabel);
  set('promoCode', CONFIG.promoCode);
  set('promoNote', l.promoNote.replace('%d', CONFIG.promoDiscount));
  set('copyBtn', l.copy);
  set('reorderTitle', l.reorderTitle);
  set('reorderNote', l.reorderNote);
  set('buyBtn', l.buyBtn);
  document.getElementById('buyBtn').href = buyUrl(l);
  set('reviewTitle', l.reviewTitle);
  set('reviewNote', l.reviewNote);
  set('reviewBtn', l.reviewBtn);
  document.getElementById('reviewBtn').href = reviewUrl(l);
  set('guideTitle', l.guideTitle);
  set('g1', l.g1);
  set('g2', l.g2);
  set('g3', l.g3);

  // Tips
  set('tipsLabel', l.tipsLabel);
  document.getElementById('tip1').textContent = l.tip1;
  document.getElementById('tip2').textContent = l.tip2;
  document.getElementById('tip3').textContent = l.tip3;

  // Trust & footer
  set('t1', l.t1);
  set('t2', l.t2);
  set('t3', l.t3);
  document.getElementById('footerText').innerHTML =
    CONFIG.brandName + ' · <a href="mailto:' + CONFIG.supportEmail + '">' + CONFIG.supportEmail + '</a><br>' +
    l.footer +
    (CONFIG.imprintUrl ? '<br><a href="' + CONFIG.imprintUrl + '" target="_blank" rel="noopener">Impressum / Imprint</a>' : '');

  buildLangBar();
}

function buildLangBar() {
  const bar = document.getElementById('langBar');
  bar.innerHTML = '';
  Object.keys(L).forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'lang-btn' + (k === cur ? ' active' : '');
    btn.textContent = L[k].flag + ' ' + L[k].label;
    btn.onclick = () => applyLang(k);
    bar.appendChild(btn);
  });
}

// ─── Amazon links ─────────────────────────────────────────────────
function reviewUrl(l) {
  if (CONFIG.asins.length === 1) {
    return 'https://www.amazon.' + l.domain + '/review/create-review?asin=' + encodeURIComponent(CONFIG.asins[0]);
  }
  // Zero or multiple ASINs: send the buyer to their order history so the
  // review lands on the listing they actually purchased.
  return 'https://www.amazon.' + l.domain + '/gp/your-account/order-history';
}

function buyUrl(l) {
  return 'https://www.amazon.' + l.domain + '/s?k=' + encodeURIComponent(CONFIG.brandName + ' ' + l.brandSub);
}

// ─── Copy promo code ──────────────────────────────────────────────
async function copyCode() {
  const btn = document.getElementById('copyBtn');
  const code = CONFIG.promoCode;
  try {
    await navigator.clipboard.writeText(code);
    trackEvent('copy_code', { lang: cur });
    btn.textContent = L[cur].copied;
    setTimeout(() => { btn.textContent = L[cur].copy; }, 1500);
  } catch {
    // Clipboard API unavailable (older browsers / insecure context):
    // select the code text so the user can long-press-copy
    const el = document.getElementById('promoCode');
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
}

// ─── Form submit ──────────────────────────────────────────────────
async function handleSubmit() {
  const email = document.getElementById('emailInput').value.trim();
  const order = document.getElementById('orderInput').value.trim();
  const marketing = document.getElementById('optinInput').checked;
  let ok = true;

  document.getElementById('emailErr').style.display = 'none';
  document.getElementById('orderErr').style.display = 'none';
  document.getElementById('submitErr').style.display = 'none';
  document.getElementById('emailInput').classList.remove('error');
  document.getElementById('orderInput').classList.remove('error');

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    document.getElementById('emailErr').style.display = 'block';
    document.getElementById('emailInput').classList.add('error');
    ok = false;
  }
  if (!/^\d{4}$/.test(order)) {
    document.getElementById('orderErr').style.display = 'block';
    document.getElementById('orderInput').classList.add('error');
    ok = false;
  }
  if (!ok) return;

  const btn = document.getElementById('ctaBtn');
  const label = document.getElementById('ctaText');
  btn.disabled = true;
  label.textContent = L[cur].ctaLoading;

  trackEvent('submit', { lang: cur, order_suffix: order });

  try {
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email, order_suffix: order, lang: cur, marketing_consent: marketing,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error('submit rejected');

    document.getElementById('formWrap').style.display = 'none';
    document.getElementById('successWrap').style.display = 'flex';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch {
    document.getElementById('submitErr').style.display = 'block';
    btn.disabled = false;
    label.textContent = L[cur].cta;
  }
}

// ─── Analytics helper ─────────────────────────────────────────────
function trackEvent(name, props) {
  fetch('/api/track', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ event: name, ...props, ts: Date.now() })
  }).catch(() => {});
}

// ─── Input listeners ──────────────────────────────────────────────
document.getElementById('emailInput').addEventListener('input', () => {
  document.getElementById('emailErr').style.display = 'none';
  document.getElementById('emailInput').classList.remove('error');
});
document.getElementById('orderInput').addEventListener('input', () => {
  document.getElementById('orderErr').style.display = 'none';
  document.getElementById('orderInput').classList.remove('error');
});

// ─── Init ─────────────────────────────────────────────────────────
applyLang(cur);

window.addEventListener('load', () => {
  trackEvent('pageview', { lang: cur, ref: document.referrer });
});
</script>
