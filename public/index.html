<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Produkt registrieren — Garantie aktivieren</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Registrieren Sie Ihr Produkt und aktivieren Sie 12 Monate kostenlose Garantieverlängerung.">
<meta property="og:title" content="Produkt registrieren — Garantie aktivieren">
<meta property="og:description" content="12 Monate kostenlose Garantieverlängerung für Ihre Staubsaugerbeutel aktivieren.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0f1d30">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a2e4a'/%3E%3Cpath d='M32 12l16 6v12c0 10-6.8 18.4-16 22-9.2-3.6-16-12-16-22V18l16-6z' fill='none' stroke='%23c8a84b' stroke-width='4'/%3E%3Cpath d='M24 32l6 6 12-12' fill='none' stroke='%23c8a84b' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ══════════════════════════════════════════════════════════════════
   设计 token —— 与 design/design-system.html 同源
   组件只写语义别名（--text-muted / --surface / --border），不直接写色阶
   ══════════════════════════════════════════════════════════════════ */
:root{
  --navy-950:#0a1524; --navy-900:#0f1d30; --navy-800:#152942;
  --navy-700:#1a2e4a; --navy-600:#27405f; --navy-500:#3b5a7d;
  --navy-400:#5f7d9e; --navy-300:#93a9c1; --navy-200:#c3d0de;
  --navy-100:#e3eaf1; --navy-50:#f3f7fa;
  --gold-800:#6f5716; --gold-700:#8f7220; --gold-600:#ad8d31;
  --gold-500:#c8a84b; --gold-400:#d9bd6d; --gold-300:#e8c96a;
  --gold-200:#f1e0ad; --gold-100:#f9f2dc; --gold-50:#fdfbf3;
  --ink-900:#171614; --ink-800:#2e2b28; --ink-700:#4a4641;
  --ink-600:#6b6560; --ink-500:#8a837c; --ink-400:#a9a29a;
  --ink-300:#c9c3ba; --ink-200:#e2ddd3; --ink-100:#f0ece4; --ink-50:#f9f7f3;
  --bg:#f6f4ef; --surface:#ffffff;
  --border:#e2ddd3; --border-strong:#cfc8bb;
  --text:#171614; --text-body:#3d3a36; --text-muted:#6b6560; --text-faint:#8a837c;
  --success-700:#1f6b43; --success-600:#2d7a4f; --success-100:#e7f4ec;
  --danger-700:#a5291c; --danger-600:#c0392b; --danger-100:#fdecea;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-full:999px;
  --sh-sm:0 2px 6px rgba(23,22,20,.07), 0 1px 2px rgba(23,22,20,.04);
  --sh-md:0 10px 26px -8px rgba(15,29,48,.16), 0 2px 6px rgba(23,22,20,.05);
  --sh-lg:0 24px 52px -16px rgba(15,29,48,.26);
  --sh-gold:0 8px 22px -6px rgba(200,168,75,.5);
  --ease:cubic-bezier(.2,.7,.3,1);
  --t-fast:120ms; --t-base:180ms; --t-slow:300ms;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text-body);
  font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;min-height:100vh;
}
.page{width:100%;max-width:480px;background:var(--bg);display:flex;flex-direction:column;flex:1;position:relative}

/* ── 粘性顶栏 ─────────────────────────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:60;background:rgba(15,29,48,.92);
  backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);
  border-bottom:1px solid rgba(255,255,255,.09);
}
/* 上下 padding 从 10 收到 8：lang-trigger 抬到 44px 触摸目标后，
   顶栏总高仍是 8+44+8 = 60px，不会把表单往下推。 */
.tb-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;min-width:0}
.brand-mark{flex-shrink:0;display:block}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-text b{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;line-height:1.2}
.brand-text i{font-size:9.5px;font-style:normal;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--gold-400);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.lang-trigger{
  display:inline-flex;align-items:center;gap:7px;flex-shrink:0;
  min-height:44px;padding:0 12px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  border-radius:var(--r-full);color:#fff;font:inherit;font-size:13px;font-weight:650;
  cursor:pointer;transition:background var(--t-base) var(--ease),border-color var(--t-base) var(--ease);
}
.lang-trigger:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28)}
.lang-trigger:focus-visible{outline:2px solid var(--gold-400);outline-offset:2px}
.lang-trigger .chev{transition:transform var(--t-base) var(--ease);opacity:.7}
.lang-trigger[aria-expanded="true"] .chev{transform:rotate(180deg)}

/* ── Hero ─────────────────────────────────────────────────────── */
.hero{
  position:relative;overflow:hidden;background:var(--navy-900);
  /* 上下留白刻意收紧：目标是把主 CTA 顶到 390×844 的首屏内 */
  padding:24px 24px 74px;text-align:center;color:#fff;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(120% 90% at 88% -10%, rgba(200,168,75,.20) 0%, transparent 58%),
    radial-gradient(90% 70% at 6% 108%, rgba(59,90,125,.55) 0%, transparent 60%);
  pointer-events:none;
}
.hero-shield{position:relative;margin:0 auto 11px;width:52px;height:52px}
.hero-title{
  position:relative;font-size:26px;line-height:1.24;font-weight:600;
  letter-spacing:-.4px;margin-bottom:10px;max-width:20ch;margin-inline:auto;
}
.hero-title em{font-style:normal;color:var(--gold-300)}
.hero-sub{
  position:relative;font-size:13.5px;line-height:1.55;color:rgba(255,255,255,.74);
  max-width:32ch;margin:0 auto 16px;
}
.hero-chips{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;list-style:none}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:var(--r-full);
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  font-size:11px;font-weight:600;color:rgba(255,255,255,.92);white-space:nowrap;
}
.chip svg{color:var(--gold-400);flex-shrink:0}

/* ── 主卡片（上浮压住 hero） ──────────────────────────────────── */
.stage-wrap{padding:0 16px;margin-top:-64px;position:relative;z-index:10}
.card{
  background:var(--surface);border-radius:var(--r-xl);
  box-shadow:var(--sh-lg);padding:20px 20px 22px;
}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-head h2{font-size:19px;line-height:1.28;font-weight:700;letter-spacing:-.2px;color:var(--text)}
.card-head p{font-size:12.5px;color:var(--text-muted);margin-top:3px}
.time-pill{
  display:inline-flex;align-items:center;gap:5px;flex-shrink:0;
  padding:5px 10px;border-radius:var(--r-full);
  background:var(--gold-100);color:var(--gold-800);
  font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;
}

/* ── 表单字段 ─────────────────────────────────────────────────── */
.field{margin-bottom:13px}
.field > label{display:block;font-size:13px;font-weight:650;color:var(--text-body);margin-bottom:6px}
.control{
  display:flex;align-items:center;gap:10px;
  min-height:52px;padding:0 14px;
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-md);
  transition:border-color var(--t-base) var(--ease),box-shadow var(--t-base) var(--ease);
}
.control:focus-within{border-color:var(--navy-700);box-shadow:0 0 0 3px var(--navy-100)}
.control .lead-icon{flex-shrink:0;color:var(--text-faint);transition:color var(--t-base) var(--ease)}
.control:focus-within .lead-icon{color:var(--navy-600)}
.control input{
  flex:1;min-width:0;border:none;outline:none;background:none;font:inherit;
  font-size:16px;color:var(--text);padding:14px 0;
}
.control input::placeholder{color:var(--text-faint)}
.control .tail{flex-shrink:0;opacity:0;transition:opacity var(--t-base) var(--ease)}
.control.is-ok .tail{opacity:1}
.control.is-ok{border-color:var(--success-600)}
.control.is-error{border-color:var(--danger-600);box-shadow:0 0 0 3px var(--danger-100)}
.control.is-error .lead-icon{color:var(--danger-600)}
.control.is-validating .tail{opacity:1}

/* 订单后 4 位：等宽 + 大字距，看起来就是「4 个数字」 */
#orderInput{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;letter-spacing:.28em;font-weight:600}
#orderInput::placeholder{letter-spacing:.28em;font-weight:400}

.err-msg{
  display:none;align-items:center;gap:5px;margin-top:7px;
  font-size:12.5px;font-weight:550;color:var(--danger-700);
}
.err-msg.show{display:flex}
.err-msg svg{flex-shrink:0}

/* 订单号帮助（原生折叠，零 JS） */
.help{background:var(--navy-50);border:1px solid var(--navy-100);border-radius:var(--r-sm);margin-top:8px;overflow:hidden}
.help summary{
  list-style:none;cursor:pointer;padding:8px 12px;min-height:44px;
  display:flex;align-items:center;gap:6px;
  font-size:12px;font-weight:600;color:var(--navy-700);
}
.help summary::-webkit-details-marker{display:none}
.help summary .caret{margin-left:auto;transition:transform var(--t-base) var(--ease);flex-shrink:0}
.help[open] summary .caret{transform:rotate(180deg)}
.help p{padding:0 12px 11px;font-size:12.5px;line-height:1.6;color:var(--text-muted)}

/* 营销同意 */
.optin{display:flex;gap:11px;align-items:flex-start;cursor:pointer;margin:2px 0 15px;padding:2px 0;min-height:44px}
.optin input{
  width:20px;height:20px;flex-shrink:0;margin-top:2px;cursor:pointer;
  accent-color:var(--navy-700);border-radius:5px;
}
.optin span{font-size:12.5px;line-height:1.55;color:var(--text-muted)}
.optin input:focus-visible{outline:2px solid var(--navy-700);outline-offset:2px}

/* CTA */
.cta{
  width:100%;min-height:54px;display:flex;align-items:center;justify-content:center;gap:9px;
  background:var(--gold-500);color:var(--navy-900);
  border:none;border-radius:var(--r-md);
  font:inherit;font-size:16px;font-weight:700;letter-spacing:.01em;
  cursor:pointer;box-shadow:var(--sh-gold);
  transition:background var(--t-base) var(--ease),transform var(--t-fast) var(--ease),box-shadow var(--t-base) var(--ease);
}
.cta:hover{background:var(--gold-400)}
.cta:active{transform:translateY(1px)}
.cta:focus-visible{outline:2px solid var(--navy-700);outline-offset:3px}
.cta:disabled{opacity:.62;cursor:not-allowed;box-shadow:none;transform:none}
.cta .arrow{transition:transform var(--t-base) var(--ease)}
.cta:hover .arrow{transform:translateX(3px)}
.cta.is-loading .arrow{display:none}
.spinner{
  width:17px;height:17px;border-radius:50%;flex-shrink:0;
  border:2px solid rgba(15,29,48,.28);border-top-color:var(--navy-900);
  animation:spin .7s linear infinite;display:none;
}
.cta.is-loading .spinner{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

.submit-err{
  display:none;align-items:center;justify-content:center;gap:6px;
  margin-top:12px;padding:10px 12px;border-radius:var(--r-sm);
  background:var(--danger-100);color:var(--danger-700);
  font-size:13px;font-weight:600;
}
.submit-err.show{display:flex}

.gdpr{margin-top:13px;font-size:11.5px;line-height:1.6;color:var(--text-muted);text-align:center}

/* ── 信任条 ───────────────────────────────────────────────────── */
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:20px 16px 4px}
.trust-item{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.trust-item svg{color:var(--navy-500)}
.trust-item span{font-size:11px;font-weight:600;color:var(--text-muted);line-height:1.35}

/* ── 区块通用 ─────────────────────────────────────────────────── */
.section{padding:26px 20px 0}
.section > h2{font-size:16px;font-weight:700;color:var(--text);margin-bottom:14px;letter-spacing:-.1px}

/* ── 流程步骤（纵向带连接线） ────────────────────────────────── */
.steps{list-style:none;position:relative}
.steps li{display:flex;gap:13px;align-items:flex-start;padding-bottom:16px;position:relative}
.steps li:last-child{padding-bottom:0}
.steps li::before{
  content:'';position:absolute;left:13px;top:30px;bottom:0;width:2px;
  background:linear-gradient(var(--navy-100),var(--navy-100));border-radius:2px;
}
.steps li:last-child::before{display:none}
.step-num{
  flex-shrink:0;width:28px;height:28px;border-radius:50%;
  background:var(--navy-700);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:700;position:relative;z-index:1;
}
.step-num.done{background:var(--success-600)}
.step-txt b{display:block;font-size:14px;font-weight:650;color:var(--text);line-height:1.4}
.step-txt small{display:block;font-size:12.5px;line-height:1.55;color:var(--text-muted);margin-top:2px}

/* ── FAQ ──────────────────────────────────────────────────────── */
.faq{display:flex;flex-direction:column;gap:8px}
details.acc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
details.acc summary{
  list-style:none;cursor:pointer;min-height:48px;
  padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:13.5px;font-weight:650;color:var(--text);
}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary:focus-visible{outline:2px solid var(--navy-700);outline-offset:-3px}
details.acc summary::after{
  content:'';width:8px;height:8px;flex-shrink:0;
  border-right:2px solid var(--text-faint);border-bottom:2px solid var(--text-faint);
  transform:rotate(45deg) translate(-1px,-1px);
  transition:transform var(--t-base) var(--ease);
}
details.acc[open] summary::after{transform:rotate(-135deg) translate(-1px,-1px)}
details.acc .acc-body{padding:0 15px 14px;font-size:13px;line-height:1.62;color:var(--text-muted)}

/* ── 页脚 ─────────────────────────────────────────────────────── */
.footer{padding:26px 20px 34px;text-align:center;font-size:11px;line-height:1.7;color:var(--text-muted)}
.footer a{color:var(--navy-600);text-decoration:none;border-bottom:1px solid var(--navy-200)}
/* 法律声明是必须被阅读的正文，不能用 --text-faint（3.4:1）—— 那是占位符/图标专用 */
.footer .legal{margin-top:8px;color:var(--text-muted)}

/* ══ 成功态 ═════════════════════════════════════════════════════ */
/* 自带深色头图：注册完成后折扣码必须落在首屏内，不能要求用户再往下滚 */
.success{display:none;padding:0}
.success.on{display:block}
.success-hero{
  position:relative;overflow:hidden;background:var(--navy-900);color:#fff;
  padding:30px 24px 30px;text-align:center;
}
.success-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(120% 90% at 85% -20%, rgba(200,168,75,.22) 0%, transparent 58%);
  pointer-events:none;
}
.success-body{padding:20px 20px 0}
.ok-ring{
  position:relative;width:74px;height:74px;margin:0 auto 16px;border-radius:50%;
  background:var(--success-100);display:flex;align-items:center;justify-content:center;
}
.ok-ring svg{width:38px;height:38px}
.ok-ring path{
  stroke:var(--success-600);stroke-width:3.2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:44;stroke-dashoffset:44;
}
.success.on .ok-ring{animation:pop var(--t-slow) var(--ease) both}
.success.on .ok-ring path{animation:draw 480ms var(--ease) 160ms both}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.success h2{font-size:22px;font-weight:700;color:#fff;letter-spacing:-.3px;margin-bottom:8px;position:relative}
.success .sub{font-size:13.5px;line-height:1.65;color:rgba(255,255,255,.72);max-width:32ch;margin:0 auto;position:relative}

/* 折扣票券（CONFIG.promoCode 为空时整块隐藏） */
.ticket{
  position:relative;background:var(--navy-900);border-radius:var(--r-lg);
  padding:18px 18px 16px;color:#fff;overflow:hidden;text-align:center;
  box-shadow:var(--sh-md);
}
.ticket::before,.ticket::after{
  content:'';position:absolute;top:50%;width:20px;height:20px;border-radius:50%;
  background:var(--bg);transform:translateY(-50%);
}
.ticket::before{left:-10px} .ticket::after{right:-10px}
.ticket-label{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-300);margin-bottom:12px}
.ticket-code{
  display:block;width:100%;padding:13px;
  background:rgba(255,255,255,.07);border:1.5px dashed rgba(200,168,75,.55);
  border-radius:var(--r-md);color:var(--gold-300);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:21px;font-weight:700;letter-spacing:.16em;text-align:center;
}
.ticket-note{font-size:11.5px;line-height:1.5;color:rgba(255,255,255,.62);margin-top:11px}
.ticket-note b{color:var(--gold-300);font-weight:700}
.copy-row{display:flex;gap:8px;margin-top:12px}
.copy-btn{
  flex:1;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--gold-500);color:var(--navy-900);border:none;border-radius:var(--r-md);
  font:inherit;font-size:14px;font-weight:700;cursor:pointer;
  transition:background var(--t-base) var(--ease);
}
.copy-btn:hover{background:var(--gold-400)}
.copy-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.saved-hint{font-size:11.5px;color:var(--text-muted);margin-top:10px;display:flex;align-items:center;justify-content:center;gap:5px}

/* 后续动作卡 */
.act{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:17px;text-align:left;margin-top:12px;
}
.act h3{font-size:14.5px;font-weight:700;color:var(--text);margin-bottom:5px;line-height:1.4}
.act p{font-size:12.5px;line-height:1.58;color:var(--text-muted);margin-bottom:13px}
.act-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;border-radius:var(--r-md);text-decoration:none;
  font-size:14px;font-weight:650;transition:background var(--t-base) var(--ease),border-color var(--t-base) var(--ease);
}
.act-btn.solid{background:var(--navy-700);color:#fff}
.act-btn.solid:hover{background:var(--navy-900)}
.act-btn.outline{background:var(--surface);color:var(--navy-700);border:1.5px solid var(--navy-200)}
.act-btn.outline:hover{background:var(--navy-50);border-color:var(--navy-300)}
.act-btn:focus-visible{outline:2px solid var(--navy-700);outline-offset:2px}
.guide{margin-top:13px;padding-top:13px;border-top:1px dashed var(--border)}
.guide-t{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px}
.guide li{font-size:12.5px;line-height:1.55;color:var(--text-muted);padding:5px 0;list-style:none;display:flex;gap:7px}
.guide li::before{content:'';flex-shrink:0;width:5px;height:5px;border-radius:50%;background:var(--gold-500);margin-top:8px}

/* ── 语言抽屉 ─────────────────────────────────────────────────── */
.scrim{
  position:fixed;inset:0;z-index:100;background:rgba(10,21,36,.5);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;visibility:hidden;transition:opacity var(--t-slow) var(--ease),visibility var(--t-slow);
}
.scrim.on{opacity:1;visibility:visible}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:101;
  max-width:480px;margin:0 auto;
  background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:8px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform var(--t-slow) var(--ease);
  max-height:82vh;overflow-y:auto;box-shadow:var(--sh-lg);
}
.sheet.on{transform:translateY(0)}
.sheet-grab{width:38px;height:4px;border-radius:2px;background:var(--ink-300);margin:6px auto 14px}
.sheet h3{font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lang-opt{
  display:flex;align-items:center;gap:10px;min-height:52px;padding:0 13px;
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-md);
  font:inherit;font-size:13.5px;font-weight:600;color:var(--text-body);
  cursor:pointer;text-align:left;transition:border-color var(--t-base) var(--ease),background var(--t-base) var(--ease);
}
.lang-opt:hover{background:var(--navy-50);border-color:var(--navy-200)}
.lang-opt:focus-visible{outline:2px solid var(--navy-700);outline-offset:2px}
.lang-opt .fl{font-size:19px;line-height:1;flex-shrink:0}
.lang-opt .nm{display:flex;flex-direction:column;min-width:0}
.lang-opt .nm small{font-size:10.5px;font-weight:600;color:var(--text-muted);letter-spacing:.06em}
.lang-opt[aria-current="true"]{border-color:var(--navy-700);background:var(--navy-50)}
.lang-opt[aria-current="true"] .nm b{color:var(--navy-700)}
.lang-opt .tick{margin-left:auto;color:var(--navy-700);display:none;flex-shrink:0}
.lang-opt[aria-current="true"] .tick{display:block}

/* ── Toast ────────────────────────────────────────────────────── */
.toast{
  position:fixed;left:50%;bottom:26px;z-index:200;
  transform:translate(-50%,20px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:8px;
  padding:11px 17px;border-radius:var(--r-full);
  background:var(--navy-900);color:#fff;font-size:13px;font-weight:600;
  box-shadow:var(--sh-lg);transition:opacity var(--t-base) var(--ease),transform var(--t-base) var(--ease);
  max-width:calc(100vw - 32px);
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ── 降级：尊重系统「减少动态效果」 ──────────────────────────── */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .sheet{transform:none}
}
</style>

const ORDER = ['de','fr','it','es','nl','en'];
const $ = id => document.getElementById(id);
const hasPromo = !!CONFIG.promoCode;

function detectLang(){
  const nav = (navigator.language || (navigator.languages && navigator.languages[0]) || 'de');
  const code = nav.split('-')[0].toLowerCase();
  return L[code] ? code : 'de';
}
let cur = detectLang();

// ─── 渲染语言 ─────────────────────────────────────────────────────
function applyLang(k){
  cur = k;
  const l = L[k];
  document.documentElement.lang = k;
  const set = (id, t) => { const el = $(id); if (el) el.textContent = t; };

  $('brandName').textContent = CONFIG.brandName;
  set('brandSub', l.brandSub);
  $('heroTitle').innerHTML = l.title;
  set('heroSub', l.sub);
  set('c1', l.c1); set('c2', l.c2); set('c3', l.c3);

  set('cardTitle', l.cardTitle); set('cardSub', l.cardSub);
  set('emailLabel', l.emailLabel); $('emailInput').placeholder = l.emailPh;
  set('orderLabel', l.orderLabel); $('orderInput').placeholder = l.orderPh;
  set('orderHelpTitle', l.orderHelpTitle); set('orderHelpText', l.orderHelpText);
  set('optinText', l.optin);
  set('ctaText', l.cta);
  set('gdprText', l.gdpr);
  set('emailErrText', l.emailErr);
  set('orderErrText', l.orderErr);
  set('submitErrText', l.submitErr);

  set('okTitle', l.okTitle); set('okSub', l.okSub); set('okSaved', l.okSaved);
  // 折扣票券：CONFIG.promoCode 留空时整块（含 savedHint）隐藏
  $('ticket').style.display = hasPromo ? '' : 'none';
  $('savedHint').style.display = hasPromo ? '' : 'none';
  set('promoLabel', l.promoLabel);
  $('promoCode').textContent = CONFIG.promoCode;
  set('promoNote', l.promoNote.replace('%d', CONFIG.promoDiscount));
  set('copyText', l.copy);
  set('reorderTitle', l.reorderTitle); set('reorderNote', l.reorderNote);
  set('buyText', l.buyBtn); $('buyBtn').href = buyUrl(l);
  set('reviewTitle', l.reviewTitle); set('reviewNote', l.reviewNote);
  set('reviewText', l.reviewBtn); $('reviewBtn').href = reviewUrl(l);
  set('guideTitle', l.guideTitle);
  set('g1', l.g1); set('g2', l.g2); set('g3', l.g3);

  set('stepsLabel', l.stepsLabel);
  set('s1t', l.s1t); set('s1d', l.s1d);
  set('s2t', l.s2t); set('s2d', l.s2d);
  set('s3t', l.s3t); set('s3d', l.s3d);

  set('faqTitle', l.faqTitle);
  set('faq1q', l.faq1q); set('faq1a', l.faq1a);
  set('faq2q', l.faq2q); set('faq2a', l.faq2a);
  set('faq3q', l.faq3q); set('faq3a', l.faq3a.replace('%e', CONFIG.supportEmail));

  set('t1', l.t1); set('t2', l.t2); set('t3', l.t3);
  set('sheetTitle', l.sheetTitle);
  $('langCurrent').textContent = l.code;

  $('footerText').innerHTML =
    CONFIG.brandName + ' · <a href="mailto:' + CONFIG.supportEmail + '">' + CONFIG.supportEmail + '</a>' +
    '<div class="legal">' + l.footer +
    (CONFIG.imprintUrl ? ' <a href="' + CONFIG.imprintUrl + '" target="_blank" rel="noopener">Impressum</a>' : '') +
    '</div>';

  buildLangGrid();
}

// ─── 语言抽屉 ─────────────────────────────────────────────────────
function buildLangGrid(){
  $('langGrid').innerHTML = ORDER.map(k => {
    const l = L[k];
    return `<button type="button" class="lang-opt" data-lang="${k}" aria-current="${k === cur}">
      <span class="fl" aria-hidden="true">${l.flag}</span>
      <span class="nm"><b>${l.name}</b><small>${l.code}</small></span>
      <svg class="tick" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M4 12.5l5.5 5.5L20 7"/></svg>
    </button>`;
  }).join('');
  $('langGrid').querySelectorAll('.lang-opt').forEach(b => {
    b.addEventListener('click', () => { applyLang(b.dataset.lang); closeSheet(); });
  });
}

function openSheet(){
  $('scrim').classList.add('on');
  $('sheet').classList.add('on');
  $('langTrigger').setAttribute('aria-expanded', 'true');
  const first = $('langGrid').querySelector('[aria-current="true"]') || $('langGrid').querySelector('.lang-opt');
  first && first.focus();
}
function closeSheet(){
  $('scrim').classList.remove('on');
  $('sheet').classList.remove('on');
  $('langTrigger').setAttribute('aria-expanded', 'false');
}
$('langTrigger').addEventListener('click', () => {
  $('sheet').classList.contains('on') ? closeSheet() : openSheet();
});
$('scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

// ─── Amazon 链接 ──────────────────────────────────────────────────
// 语言 → 站点后缀。EN 是给非德语的英语用户看的，仍落在德国站（卖家实际经营站点）。
const DOMAIN = { de:'de', fr:'fr', it:'it', es:'es', nl:'nl', en:'de' };

function reviewUrl(l){
  const d = DOMAIN[l.code.toLowerCase()] || 'de';
  if (CONFIG.asins.length === 1){
    return 'https://www.amazon.' + d + '/review/create-review?asin=' + encodeURIComponent(CONFIG.asins[0]);
  }
  // 0 个或多个 ASIN：退到「我的订单」，避免买家评错 listing
  return 'https://www.amazon.' + d + '/gp/your-account/order-history';
}
function buyUrl(l){
  const d = DOMAIN[l.code.toLowerCase()] || 'de';
  return 'https://www.amazon.' + d + '/s?k=' + encodeURIComponent(CONFIG.brandName + ' ' + l.brandSub);
}

// ─── Toast ────────────────────────────────────────────────────────
let toastTimer;
function toast(msg){
  $('toastText').textContent = msg;
  $('toast').classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('on'), 2200);
}

// ─── 复制折扣码 ───────────────────────────────────────────────────
$('copyBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(CONFIG.promoCode);
    toast(L[cur].copied + ' ✓');
  } catch {
    const el = $('promoCode');
    const r = document.createRange();
    r.selectNodeContents(el);
    const s = window.getSelection();
    s.removeAllRanges(); s.addRange(r);
    toast(L[cur].copy);
  }
  trackEvent('copy_code', { lang: cur });
});

// ─── 表单校验 ─────────────────────────────────────────────────────
const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

function markField(ctlId, errId, bad){
  $(ctlId).classList.toggle('is-error', bad);
  $(errId).classList.toggle('show', bad);
  $(ctlId).classList.remove('is-ok');
}
function clearField(ctlId, errId){
  $(ctlId).classList.remove('is-error', 'is-ok');
  $(errId).classList.remove('show');
}

$('emailInput').addEventListener('input', () => clearField('emailCtl', 'emailErr'));
$('emailInput').addEventListener('blur', () => {
  const v = $('emailInput').value.trim();
  if (!v) return;
  if (emailRe.test(v)) { clearField('emailCtl', 'emailErr'); $('emailCtl').classList.add('is-ok'); }
  else markField('emailCtl', 'emailErr', true);
});

// 订单后 4 位：只允许数字，自动截断
$('orderInput').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
  clearField('orderCtl', 'orderErr');
});
$('orderInput').addEventListener('blur', () => {
  const v = $('orderInput').value.trim();
  if (!v) return;
  if (/^\d{4}$/.test(v)) { clearField('orderCtl', 'orderErr'); $('orderCtl').classList.add('is-ok'); }
  else markField('orderCtl', 'orderErr', true);
});

// ─── 提交 ─────────────────────────────────────────────────────────
$('regForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('emailInput').value.trim();
  const order = $('orderInput').value.trim();
  let ok = true;

  if (!emailRe.test(email)) { markField('emailCtl', 'emailErr', true); ok = false; }
  if (!/^\d{4}$/.test(order)) { markField('orderCtl', 'orderErr', true); ok = false; }
  $('submitErr').classList.remove('show');
  if (!ok) {
    const firstBad = document.querySelector('.control.is-error input');
    firstBad && firstBad.focus();
    return;
  }

  const btn = $('ctaBtn');
  btn.disabled = true;
  btn.classList.add('is-loading');
  $('ctaText').textContent = L[cur].ctaLoading;

  trackEvent('submit', { lang: cur, order_suffix: order });

  try {
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email, order_suffix: order, lang: cur,
        marketing_consent: $('optinInput').checked,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error('rejected');
    showSuccess();
  } catch {
    $('submitErr').classList.add('show');
    btn.disabled = false;
    btn.classList.remove('is-loading');
    $('ctaText').textContent = L[cur].cta;
  }
});

function showSuccess(){
  // 隐藏 hero：让成功态的头图 + 折扣码整体上移进首屏
  document.querySelector('.hero').style.display = 'none';
  $('formState').style.display = 'none';
  $('successState').classList.add('on');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── 埋点 ─────────────────────────────────────────────────────────
function trackEvent(name, props){
  try {
    fetch('/api/track', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ event: name, ...props, ts: Date.now() }),
    }).catch(() => {});
  } catch (_) {}
}

// ─── 初始化 ───────────────────────────────────────────────────────
applyLang(cur);
window.addEventListener('load', () => trackEvent('pageview', { lang: cur, ref: document.referrer }));
</script>
</body>
</html>
